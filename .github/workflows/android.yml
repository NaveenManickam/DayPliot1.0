name: DayPilot Android Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Generate a fresh Android host project
        run: flutter create --project-name daypilot --org com.naveenmanickam --platforms=android .

      - name: Configure Android ID, alarms and biometrics
        run: python3 tool/configure_android.py

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Dart source
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run tests
        run: flutter test --no-pub

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daypilot-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
