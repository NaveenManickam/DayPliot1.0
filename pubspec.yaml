name: daypilot
description: DayPilot offline-first personal planner
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.6
  path: ^1.9.1
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  intl: ^0.20.3
  crypto: ^3.0.8
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/daypilot.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/daypilot.png
  adaptive_icon_background: '#F6F7FE'
  adaptive_icon_foreground: assets/icon/daypilot.png
